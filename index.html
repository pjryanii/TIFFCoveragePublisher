<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>TIFF Coverage Publisher</title>

  <link
    rel="stylesheet"
    href="https://js.arcgis.com/4.33/esri/themes/light/main.css">

  <link
    rel="stylesheet"
    href="./styles.css">

  <script src="https://js.arcgis.com/4.33/"></script>
</head>

<body>

  <main class="app-shell">

    <header class="app-header">

      <div class="header-copy">
        <h1>TIFF Coverage Publisher</h1>

        <p>
          Upload a propagation TIFF and create a persistent
          coverage record.
        </p>
      </div>

      <div class="header-session">

        <span id="userLabel">
          Not signed in
        </span>

        <button
          id="signInButton"
          class="button header-button"
          type="button">

          <span
            class="sign-in-icon"
            aria-hidden="true">
            ↪
          </span>

          <span>Sign in</span>
        </button>

        <button
          id="signOutButton"
          class="button header-button"
          type="button"
          hidden>

          <span>Sign out</span>
        </button>

      </div>

    </header>

    <section class="content-area">

      <section class="upload-card">

        <div class="section-heading">
          TIFF upload
        </div>

        <p class="section-description">
          Choose one .tif or .tiff file from your computer.
        </p>

        <label for="fileInput">
          Local TIFF file
        </label>

        <input
          id="fileInput"
          class="file-input"
          type="file"
          accept=".tif,.tiff"
          disabled>

        <button
          id="runButton"
          class="button primary full"
          type="button"
          disabled>

          <span
            class="upload-icon"
            aria-hidden="true">
            ⇧
          </span>

          <span>
            Upload and create coverage
          </span>

        </button>

      </section>

      <section
        class="status-card"
        aria-live="polite">

        <div
          id="progress"
          class="progress"
          hidden>
          <div></div>
        </div>

        <div
          id="status"
          class="status info">
          Sign in to begin.
        </div>

      </section>

      <section
        id="results"
        class="results-card"
        hidden>

        <h2>
          Coverage Record Created
        </h2>

        <div class="result-field">

          <span class="result-label">
            Analysis ID
          </span>

          <span id="analysisId"></span>

        </div>

        <div
          id="summary"
          class="result-summary">
        </div>

      </section>

    </section>

  </main>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
