<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1">

<title>
TIFF Coverage Publisher
</title>

<link
  rel="stylesheet"
  href="https://js.arcgis.com/4.33/esri/themes/light/main.css">

<link
  rel="stylesheet"
  href="styles.css">

<script src="https://js.arcgis.com/4.33/ad>
  
</head>

<body>

<main class="app-shell">

<header class="hero">

<div class="eyebrow">
TELECOM COVERAGE ANALYSIS
</div>

<h1>
TIFF Coverage Publisher
</h1>

<p>
Upload a propagation TIFF and create a
persistent coverage record for downstream
FCC PEA analysis.
</p>

</header>

<section class="card">

<div id="userLabel">
Not signed in
</div>

<br>

<button
  id="signInButton"
  class="button secondary">

Sign In

</button>

<button
  id="signOutButton"
  class="button secondary"
  hidden>

Sign Out

</button>

</section>

<section class="card">

<h2>
Propagation TIFF
</h2>

<p>
Select a TIFF generated from propagation
analysis. The uploaded TIFF will be processed
and converted into a new persistent coverage
record.
</p>

<input
  id="fileInput"
  type="file"
  accept=".tif,.tiff">

<button
  id="runButton"
  class="button primary full"
  disabled>

Create Coverage Record

</button>

</section>

<section class="card">

<div
  id="progress"
  class="progress"
  hidden>

<div></div>

</div>

<div
  id="status"
  class="status">

Sign in to begin.

</div>

</section>

<section
  id="results"
  class="card"
  hidden>

<h2>
Coverage Record Created
</h2>

<p>

<strong>
Analysis ID
</strong>

<br>

<span id="analysisId"></span>

</p>

<div id="summary"></div>

</section>

</main>

<script src="config.js"></rc="app.js"></script>
<script src="app.js"></script>

</body>

</html>
